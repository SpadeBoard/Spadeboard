<div class="cec-layering-attributes">
    <img (click)="onBringToFront($event)" [title]="'Bring to front'" src="/bring-to-front-icon.svg"/>
    <img (click)="onSendToBack($event)" [title]="'Send to back'" src ="/send-to-back-icon.svg"/>
    <img (click)="onBringForward($event)" [title]="'Bring forward'" src ="/bring-forward-icon.svg"/>
    <img (click)="onSendBackwards($event)" [title]="'Send backwards'" src ="/send-backwards-icon.svg"/>
</div>

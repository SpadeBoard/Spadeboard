<div 
    #cardEditorFace 
    [style]="getCardEditorFaceStyle()" 
    (contextmenu)="onCardEditorFaceRightClick($event)">
    <app-card-editor-face-preview-grid 
        [$shouldSnapToGrid]="shouldSnapToGrid" 
        data-html2canvas-ignore="true" />
    <app-card-editor-current-card-face-elements-per-card-face 
        [$cardFaceElementId]="cardFaceEditorPreviewElementsService.$currentCardFaceElementId()"
        [$cardFaceElementIdentifiers]="cardFaceEditorPreviewElementsService.$currentCardFaceElementIdentifiers()"
        [$cardFaceElementRts]="cardFaceEditorPreviewElementsService.$currentCardFaceElementRts()"
        [$cardFaceElementImages]="cardFaceEditorPreviewElementsService.$currentCardFaceElementImages()"
        [$cardFaceElementDimensions]="cardFaceEditorPreviewElementsService.$currentCardFaceElementDimensions()"
        [$cardFaceElementPositions]="cardFaceEditorPreviewElementsService.$currentCardFaceElementPositions()"

        [$cardFaceBorderRadius]="cardFaceBorderRadius" 

        [$shouldSnapToGrid]="shouldSnapToGrid"
        
        ($setElementPosition)="cardFaceEditorPreviewElementsService.setElementPosition($event)"
        ($setElementAttributes)="setElementAttributes($event)"
        ($setElementDimensions)="cardFaceEditorPreviewElementsService.setElementDimensions($event)"
        
        ($enableRte)="enableElement($event, 'Rt')"
        ($focusImage)="enableElement($event, 'Image')"
        ($enableImageEditor)="enableImageEditor($event)"
    />
</div>

<input 
    #importedCardFileInput 
    type="file" 
    accept=".sbd" 
    style="display: none" 
    (change)="importCard($event)" 
/>

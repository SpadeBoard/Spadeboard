<div #cardEditorFace [ngStyle]="getCardEditorFaceStyle()" (contextmenu)="onCardEditorFaceRightClick($event)">
    <app-card-editor-face-preview-grid [shouldSnapToGrid]="shouldSnapToGrid" data-html2canvas-ignore="true"/>
    <app-card-editor-current-card-face-elements-per-card-face [cardFaceBorderRadius]="cardFaceBorderRadius" [shouldSnapToGrid]="shouldSnapToGrid" #cardFaceElementsPerCardFace/>
</div>
@if (isDisplayContextMenu) {
<app-action-context-menu [ngStyle]="getRightClickMenuStyle()" [actionContextMenuItems]="actionContextMenuItems"
    (onActionContextMenuItemClick)="handleActionContextMenuItemClick($event)"></app-action-context-menu>
}

<!-- NOTE: Hidden file input for importing card-->
<input type="file" accept=".sbd" #importedCardFileInput style="display: none" (change)="onImportedCardFileSelected($event)" />

@if (unculledCprs.length > 0) {
    @for (cpr of unculledCprs; track cpr.cardPositionPerRoomId) {
    <div cdkDrag class="cpr-cdk-drag" 
            [cdkDragPreviewContainer]="'parent'"
            [ngStyle]="{
                left: getCardScreenPosition(cpr).x + 'px',
                top: getCardScreenPosition(cpr).y + 'px',
                transform: 'rotate(' + cpr.dndRotation.degrees + 'deg)',
                'z-index': cpr.zIndex
            }"
            [attr.card-position-per-room-id]="cpr.cardPositionPerRoomId" 
            (cdkDragStarted)="onDragStarted($event, cpr)"
            (cdkDragMoved)="onDragMoved($event, cpr)"
            (cdkDragDropped)="onDragDrop($event, cpr)"
            (contextmenu)="onCardRightClick($event, cpr.card.cardId)"
            #cardsPositionPerRoom
        >
            <app-card [cardScale]="cardsPositionPerRoomScale" [(card)]="cpr.card" />

            <!--WORKAROUND: Because the typical drag preview's set at 0,0, we'll make a custom one
            Then set it programmatically as to where the preview should be-->
            <div *cdkDragPreview class="cpr-cdk-drag-preview"
                [attr.cpr-cdk-drag-preview-id]="cpr.cardPositionPerRoomId"
            >
                <app-card [cardScale]="cardsPositionPerRoomScale" [(card)]="cpr.card" /> 
            </div>
    </div>
    }

    @if (currentContentMenuCpr) {
    <app-action-context-menu [ngStyle]="getRightClickMenuStyle()" [actionContextMenuItems]="cprActionContextMenuItems"
        (onActionContextMenuItemClick)="handleActionContextMenuItemClick($event)"></app-action-context-menu>
    }
}

<div class="container">
    <span class="element">
        Element:
        @if (cardEditorControlsDesignElementAttributesService.getCurrentCardFaceElementId() > -1) {
            {{ cardEditorControlsDesignElementAttributesService.getCurrentCardFaceElementId() }}
        }
    </span>
    <table>
        <tr>
            <td>W:</td>
            <td><input id="width" type="number" placeholder="W" min="0" [(ngModel)]="width"></td>
            <td>X:</td>
            <td><input type="number" id="x" placeholder="X" min="0" [(ngModel)]="x"></td>
        </tr>
        <tr>
            <td>H:</td>
            <td><input type="number" id="height" placeholder="H" min="0" [(ngModel)]="height"></td>
            <td>Y:</td>
            <td><input type="number" id="y" placeholder="Y" min="0" [(ngModel)]="y"></td>
        </tr>
    </table>
</div>

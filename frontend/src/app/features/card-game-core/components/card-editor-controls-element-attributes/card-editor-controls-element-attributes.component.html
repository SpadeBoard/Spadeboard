<app-card-editor-controls-element-layering-attributes/>
<div class="card-face-element-attributes-container">
    <span class="card-face-element">
        Element: {{ id() }}
    </span>
    <app-card-face-element-attributes-dimensions/>
    <table>
        <tr>
            <td>X:</td>
            <td><input type="number" id="x" placeholder="X" min="0" [ngModel]="coordinates.x"
                    (ngModelChange)="onXChange($event)" #xInput></td>
        </tr>
        <tr>
            <td>Y:</td>
            <td><input type="number" id="y" placeholder="Y" min="0" [ngModel]="coordinates.y"
                    (ngModelChange)="onYChange($event)" #yInput></td>
        </tr>
    </table>
</div>

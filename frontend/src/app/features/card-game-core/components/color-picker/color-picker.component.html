<div class ="color-picker-container">
    <div class="color-picker-separator">
        <input id="color-picker-input" type="color" [attr.max-length]="7" [(ngModel)]="colorValue" (ngModelChange)="onColorChange($event)" #colorPickerRef />
        <span>{{colorPickerName()}}</span>
    </div>
    <div class="color-picker-separator">
        <input id="color-value-name"  [attr.max-length]="7" [(ngModel)]="colorValue" (ngModelChange)="onColorChange($event)" #colorValueNameRef />
    </div>
</div>

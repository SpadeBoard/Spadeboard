<div class ="color-picker-container">
    <div class="color-picker-separator">
        <input id="color-picker-input" type="color" [(ngModel)]="colorValue" (ngModelChange)="onColorChange($event)" #colorPickerRef />
        <span>{{colorPickerName()}}</span>
    </div>
    <div class="color-picker-separator">
        <input id="color-value-name"  [(ngModel)]="colorValue" (ngModelChange)="onColorChange($event)" #colorValueNameRef />
    </div>
</div>

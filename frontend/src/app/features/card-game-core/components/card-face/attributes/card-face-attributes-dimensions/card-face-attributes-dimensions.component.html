<table>
    <tr>
        <td>W:</td>
        <td><input id="width" type="number" placeholder="W" [attr.min]="minWidth" [attr.max]="maxWidth"
                [(ngModel)]="width" #widthInput></td>
    </tr>
    <tr>
        <td>H:</td>
        <td><input id="height" type="number" placeholder="H" [attr.min]="minHeight" [attr.max]="maxHeight"
                [(ngModel)]="height" #heightInput></td>
    </tr>
</table>

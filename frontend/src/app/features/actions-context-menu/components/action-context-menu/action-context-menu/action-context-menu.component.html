@let items = actionContextMenuItems();
@if (items && items.length > 0) {
  <div class="action-context-menu">
    @for (actionContextMenuItem of items; track actionContextMenuItem) {
      <div class="action-context-menu-item" (click)="onContextMenuItemClick(actionContextMenuItem)">
        {{ actionContextMenuItem.name }}
      </div>
    }
  </div>
}
